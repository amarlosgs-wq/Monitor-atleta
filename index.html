/* ═══ Periodização da força — acompanha o mesociclo de corrida ═══ */
function faseForca(iso) {
  const pos = posMacro(iso);
  if (!pos) return 'plena';
  const { meso, semana, nSem } = pos;
  if (semana.fase === 'Deload') return 'reduzida';
  if (meso.k === 'M1' || meso.k === 'M2') return 'plena';
  if (meso.k === 'M3' || meso.k === 'M4') return 'reduzida';
  if (meso.k === 'M5') {
    if (semana.fase === 'PROVA') return 'zero';
    if (semana.fase === 'Taper' && nSem >= 7) return 'zero';
    if (semana.fase === 'Taper') return 'minima';
    return 'reduzida';
  }
  return 'plena';
}
const FASE_INFO = {
  plena:    { label:'Fase plena',      cor:T.mint,  nota:null },
  reduzida: { label:'Fase reduzida',   cor:T.amber, nota:'Corte 1 série de cada exercício principal e reduza ~10% da carga. Pliometria: metade do volume.' },
  minima:   { label:'Manutenção mínima', cor:T.rasp, nota:'Só o essencial — peso corporal e mobilidade. Sem carga pesada, sem pliometria máxima.' },
  zero:     { label:'Sem treino de força', cor:T.red, nota:'Prioridade total: chegar fresco. Só mobilidade leve se quiser.' },
};
function adaptarSessaoForca(sessao, fase) {
  if (!sessao) return null;
  const info = FASE_INFO[fase];
  if (fase === 'plena') return { ...sessao, faseInfo: info };
  if (fase === 'reduzida') return { ...sessao, faseInfo: info, min: Math.round(sessao.min * 0.8) };
  if (fase === 'minima') {
    const blocos = sessao.blocos
      .map(b => {
        const isEstrutural = /Aquecimento|Ativação|Volta à calma/i.test(b.t);
        if (isEstrutural) return b;
        const leves = b.itens.filter(it => /PC|Peso corporal/i.test(it.c) || it.c === '—');
        return leves.length ? { ...b, itens: leves } : null;
      })
      .filter(Boolean);
    return { ...sessao, faseInfo: info, min: Math.max(15, Math.round(sessao.min * 0.4)), blocos };
  }
  return {
    ...sessao, faseInfo: info, min: 10,
    blocos: [{ t:'😴 Descanso', itens:[
      { ex:'Sem treino de força hoje', s:'—', r:'Foco: chegar fresco', c:'—', d:'—', o:'Mobilidade leve opcional, 10min, sem esforço.' },
    ]}],
  };
}
const forcaDoDiaAdaptada = iso => adaptarSessaoForca(sessaoForcaDoDia(new Date(iso+'T12:00:00').getDay()), faseForca(iso));

/* posição no macrociclo */
function posMacro(iso) {
  const d = new Date(iso+'T12:00:00'), ini = new Date(INICIO_M1+'T12:00:00');
  const dias = Math.floor((d - ini)/86400000);
  if (dias < 0) return null;
  let acc = 0;
  for (const m of MACRO) {
    const dur = m.sem.length * 7;
    if (dias < acc + dur) {
      const idx = Math.floor((dias - acc)/7);
      return { meso:m, semana:m.sem[idx], nSem:idx+1, totalSem:m.sem.length };
    }
    acc += dur;
  }
  return null;
}
/* sessão planejada para uma data */
function sessaoDoDia(iso) {
  const pos = posMacro(iso);
  if (!pos) return null;
  const dow = new Date(iso+'T12:00:00').getDay();
  const base = MICRO[dow];
  const { meso, semana } = pos;
  const isTeste = semana.teste;

  if (base.tipo === 'Chave') {
    const det = base.chave === 1 ? semana.c1 : semana.c2;
    const libKey = isTeste ? 'TESTE' : (base.chave === 1 ? meso.c1lib : meso.c2lib);
    const lib = LIB[libKey];
    return { ...pos, dow, tipo:'Chave', titulo:`Chave ${base.chave} · ${lib.nome.split('·')[0].trim()}`,
             detalhe:det, lib, libKey, fc:lib.fc, pace:lib.pace, min:lib.min, extra:base.extra };
  }
  if (base.tipo === 'Longo') {
    const lib = isTeste ? LIB.TESTE : LIB.LONGO;
    const minEst = isTeste ? 40 : (parseInt(semana.dom) || 60);
    return { ...pos, dow, tipo: isTeste?'Teste':'Longo', titulo: isTeste?'Teste de 3km':'Longo progressivo',
             detalhe:semana.dom, lib, libKey:isTeste?'TESTE':'LONGO', fc:lib.fc, pace:lib.pace, min:minEst, extra:base.extra };
  }
  const lib = LIB[base.lib];
  return { ...pos, dow, tipo:base.tipo, titulo:base.rot, detalhe:base.rot,
           lib, libKey:base.lib, fc:base.fc, pace:base.pace, min:base.min, extra:base.extra };
}

/* ═══════════════════════ MOTOR FISIOLÓGICO ═══════════════════════ */
function rpeBase(fc) {
  if (fc == null) return null;
  if (fc<120) return 1; if (fc<136) return 2; if (fc<146) return 3;
  if (fc<156) return 4; if (fc<164) return 5; if (fc<168) return 6;
  if (fc<175) return 7; if (fc<183) return 8; if (fc<190) return 9;
  return 10;
}
function calcSRPE({ fcMedia, duracaoMin, altitudeM, hora, gradeMedio, tempC }) {
  const base = rpeBase(fcMedia);
  if (base == null || !duracaoMin) return null;
  const modAlt = altitudeM > 500 ? +(((altitudeM-500)/1000)*1.2).toFixed(1) : 0;
  let modCalor = 0;
  if (tempC != null) modCalor = tempC>32?0.7 : tempC>28?0.4 : tempC>24?0.2 : 0;
  else if (hora != null) modCalor = (hora>=13&&hora<=17)?0.4 : (hora>17&&hora<=20)?0.2 : (hora<9?-0.1:0);
  const modTerreno = gradeMedio>5?0.6 : gradeMedio>3?0.3 : 0;
  const total = Math.min(10, Math.max(1, +(base+modAlt+modCalor+modTerreno).toFixed(1)));
  return { base, modAlt, modCalor, modTerreno, rpeTotal:total, srpe:Math.round(total*duracaoMin) };
}
const cargaCat = s => s==null?'—' : s<150?'Baixa' : s<300?'Moderada' : s<450?'Alta':'Muito Alta';
const cargaCor = s => s==null?T.t3 : s<150?T.mint : s<300?T.cyan : s<450?T.amber:T.red;

function rollingStats(vals) {
  const v = vals.filter(x => x!=null && !Number.isNaN(x));
  if (!v.length) return null;
  const mean = v.reduce((a,b)=>a+b,0)/v.length;
  const sd = Math.sqrt(v.reduce((a,b)=>a+(b-mean)**2,0)/v.length) || 1;
  return { mean, sd:Math.max(sd,0.5), n:v.length };
}
const clamp = (x,a,b) => Math.min(b, Math.max(a,x));
const zTo100 = (z,inv=false) => clamp(50 + (inv?-z:z)*18, 0, 100);

/* regressão linear simples — inclinação por dia (motor das leituras de tendência) */
function slopeOf(vals) {
  const pts = vals.map((y,i)=>[i,y]).filter(([,y]) => y!=null && !Number.isNaN(y));
  if (pts.length < 4) return null;
  const n = pts.length;
  const sx = pts.reduce((a,[x])=>a+x,0), sy = pts.reduce((a,[,y])=>a+y,0);
  const sxy = pts.reduce((a,[x,y])=>a+x*y,0), sxx = pts.reduce((a,[x])=>a+x*x,0);
  const den = n*sxx - sx*sx;
  return den ? (n*sxy - sx*sy)/den : null;
}

/* baseline de uma métrica: valor do dia + banda (média móvel 28d ± 1 SD) + status vs baseline */
function baselineSerie(serie, campo, invertido=false) {
  return serie.map((d,i) => {
    const janela = serie.slice(Math.max(0,i-28), i).map(x=>x[campo]).filter(x=>x!=null);
    const st = rollingStats(janela);
    const v = d[campo];
    let status = null;
    if (v!=null && st && st.n>=3) {
      const z = (v-st.mean)/st.sd;
      status = (invertido?-z:z) >= 0.5 ? 'bom' : (invertido?-z:z) <= -0.5 ? 'ruim' : 'neutro';
    }
    return { data:d.data, valor:v, baseMean:st?.mean??null,
             baseLo: st ? st.mean-st.sd : null, baseHi: st ? st.mean+st.sd : null, status };
  });
}
function resumoBaseline(serie, campo) {
  const st = rollingStats(serie.slice(-28).map(d=>d[campo]));
  const ultimoObj = [...serie].reverse().find(d => d[campo]!=null);
  return { atual: ultimoObj?.[campo] ?? null, data: ultimoObj?.data, media: st?.mean ?? null, n: st?.n ?? 0 };
}

function calcProntidao(dia, hist) {
  if (!dia) return null;
  const bH = rollingStats(hist.map(d=>d.rmssd)), bF = rollingStats(hist.map(d=>d.fc));
  const parts = [];
  if (dia.rmssd!=null && bH && bH.n>=3) parts.push({ k:'HRV', w:0.30, v:zTo100((dia.rmssd-bH.mean)/bH.sd) });
  if (dia.fc!=null && bF && bF.n>=3) parts.push({ k:'FC repouso', w:0.25, v:zTo100((dia.fc-bF.mean)/bF.sd, true) });
  if (dia.sonoDuracao!=null || dia.sonoSubj!=null || dia.sonoEficiencia!=null || dia.estresseSono!=null) {
    const sub = [];
    if (dia.sonoDuracao!=null)   sub.push({ v: clamp((dia.sonoDuracao/8)*100,0,110), w:0.30 });
    if (dia.sonoEficiencia!=null) sub.push({ v: dia.sonoEficiencia, w:0.25 });
    if (dia.estresseSono!=null)  sub.push({ v: dia.estresseSono, w:0.25 });
    if (dia.sonoSubj!=null)      sub.push({ v: dia.sonoSubj*10, w:0.20 });
    const wSub = sub.reduce((a,p)=>a+p.w,0);
    parts.push({ k:'Sono', w:0.25, v: clamp(sub.reduce((a,p)=>a+p.v*p.w,0)/wSub, 0, 100) });
  }
  const wk = [['wFad',1],['wHum',0],['wDom',1],['wMot',0],['wStr',1]];
  const wv = wk.map(([k,inv]) => dia[k]==null?null:(inv?(6-dia[k]):dia[k])).filter(x=>x!=null);
  if (wv.length>=3) parts.push({ k:'Percepção', w:0.20, v:clamp(((wv.reduce((a,b)=>a+b,0)/wv.length)-1)/4*100,0,100) });
  if (!parts.length) return null;
  const wSum = parts.reduce((a,p)=>a+p.w,0);
  return { score: Math.round(clamp(parts.reduce((a,p)=>a+p.v*p.w,0)/wSum,0,100)), parts };
}
function calcPMC(serie) {
  const kA = 2/8, kC = 2/43;
  let atl=0, ctl=0;
  return serie.map((d,i) => {
    const carga = (d.cargaCorrida||0)+(d.cargaMuscu||0);
    if (i===0) { atl=carga; ctl=carga; }
    else { atl=carga*kA+atl*(1-kA); ctl=carga*kC+ctl*(1-kC); }
    return { ...d, carga, atl:+atl.toFixed(1), ctl:+ctl.toFixed(1), tsb:+(ctl-atl).toFixed(1),
             acwr: ctl>5 ? +(atl/ctl).toFixed(2) : null };
  });
}
const acwrStatus = a => a==null?{txt:'Sem base',c:T.t3} : a<0.8?{txt:'Destreino',c:T.blue}
  : a<=1.3?{txt:'Zona ótima',c:T.mint} : a<=1.5?{txt:'Risco moderado',c:T.amber}:{txt:'Risco alto',c:T.red};

/* ═══ Monotonia & Strain (Foster, 1998) ═══ */
function calcMonotoniaStrain(serie7d) {
  const cargas = serie7d.map(d => d.carga||0);
  if (cargas.length < 4) return null;
  const mean = cargas.reduce((a,b)=>a+b,0)/cargas.length;
  const sd = Math.sqrt(cargas.reduce((a,b)=>a+(b-mean)**2,0)/cargas.length) || 0.1;
  const monotonia = +(mean/sd).toFixed(2);
  const strain = Math.round(cargas.reduce((a,b)=>a+b,0) * monotonia);
  return { monotonia, strain, cargaTotal: Math.round(cargas.reduce((a,b)=>a+b,0)) };
}
const monotoniaStatus = m => m==null?{txt:'Sem base',c:T.t3}
  : m<1.5?{txt:'Variação saudável',c:T.mint} : m<2.0?{txt:'Atenção',c:T.amber}:{txt:'Risco alto — varie a carga',c:T.red};

/* ═══ Débito de sono acumulado (Van Dongen et al., 2003) ═══ */
function calcDebitoSono(serie7d, metaH=8) {
  const dias = serie7d.filter(d => d.sonoDuracao != null);
  if (!dias.length) return null;
  const debito = dias.reduce((acc,d) => acc + Math.max(0, metaH - d.sonoDuracao), 0);
  return { debitoH: +debito.toFixed(1), dias: dias.length, mediaH: +(dias.reduce((a,d)=>a+d.sonoDuracao,0)/dias.length).toFixed(1) };
}
const debitoStatus = h => h==null?{txt:'Sem dados',c:T.t3}
  : h<3?{txt:'Sob controle',c:T.mint} : h<7?{txt:'Acumulando',c:T.amber}:{txt:'Débito alto',c:T.red};

/* validador contra a sessão planejada do macrociclo */
function validar(plano, treino) {
  if (!plano || !treino) return null;
  const [lo,hi] = plano.fc, alvo = (lo+hi)/2;
  const scoreFC = clamp(100 - Math.abs((treino.fcMedia||alvo)-alvo)*3.5, 0, 100);
  const razao = (treino.duracaoMin||0)/plano.min;
  const scoreVol = clamp(100 - Math.abs(1-razao)*100, 0, 100);
  const total = Math.round(scoreFC*0.6 + scoreVol*0.4);
  const st = total>=90?{i:'ok',t:'Cumprido',c:T.mint} : total>=70?{i:'meio',t:'Parcial',c:T.amber}:{i:'ruim',t:'Divergente',c:T.red};

  let causa = null;
  if (scoreFC < 85 && treino.fcMedia != null) {
    const acima = treino.fcMedia > hi;
    const foraDaMeta = (treino.zonas?.CINZA||0) + (treino.zonas?.LT2||0) + (treino.zonas?.VO2||0);
    const terrenoAlto = (treino.gradeMedio||0) > 3.5;
    if (acima && plano.tipo !== 'Chave' && plano.tipo !== 'Teste') {
      causa = terrenoAlto
        ? `FC ${Math.round(treino.fcMedia)} acima do alvo — terreno acidentado (grade ${treino.gradeMedio.toFixed(1)}%) explica parte, mas ${foraDaMeta.toFixed(0)}% do tempo ficou em cinza+LT2. Pace escapou, não foi só o relevo.`
        : `FC ${Math.round(treino.fcMedia)} acima do alvo em terreno suave (grade ${treino.gradeMedio?.toFixed(1)}%) — ${foraDaMeta.toFixed(0)}% do tempo em cinza+LT2. O pace escapou pra cima sem justificativa de relevo.`;
    } else if (!acima && (plano.tipo === 'Chave' || plano.tipo === 'Teste')) {
      causa = `FC ${Math.round(treino.fcMedia)} abaixo do alvo — sessão de qualidade não atingiu o estímulo pretendido. Verifique se sobrou pique ou se a prontidão do dia pedia isso.`;
    }
  }
  if (scoreVol < 85 && causa == null) {
    causa = razao < 1
      ? `Duração ${Math.round(treino.duracaoMin)}min ficou ${Math.round((1-razao)*100)}% abaixo do planejado (~${plano.min}min).`
      : `Duração ${Math.round(treino.duracaoMin)}min ficou ${Math.round((razao-1)*100)}% acima do planejado (~${plano.min}min).`;
  }

  return { total, scoreFC:Math.round(scoreFC), scoreVol:Math.round(scoreVol), causa, ...st };
}

/* ═══════════════════════ MOTOR DO COACH — leitura de tendências ═══════════════════════
   Cada função devolve { nivel:'ok'|'atencao'|'alerta'|'info', txt } com a interpretação
   fisiológica do gráfico correspondente — o que um treinador diria olhando a curva. */
const nivelCor = n => n==='ok'?T.mint : n==='atencao'?T.amber : n==='alerta'?T.red : T.blue;
const nivelIcone = n => n==='ok'?CheckCircle2 : n==='atencao'?AlertTriangle : n==='alerta'?ShieldAlert : Info;

function lerPMC(serie) {
  const s = serie.filter(d=>d.ctl!=null);
  if (s.length < 7) return { nivel:'info', txt:'Poucos dias de carga registrados — o PMC ganha significado a partir de ~2 semanas de dados. Continue gravando o sRPE.' };
  const ult = s[s.length-1];
  const ctl14 = s.slice(-14).map(d=>d.ctl);
  const dCtl = +( (ctl14[ctl14.length-1] - ctl14[0]) ).toFixed(1);
  const tsb = ult.tsb;
  if (tsb < -25) return { nivel:'alerta',
    txt:`TSB em ${tsb}: você cruzou a linha da sobrecarga produtiva (−10 a −25) e entrou em fadiga profunda. O CTL ${dCtl>=0?'subiu':'caiu'} ${Math.abs(dCtl)} pts em 14 dias, mas fitness construída em cima de buraco não se expressa. Reduza 30–40% do volume por 3–4 dias e deixe o TSB voltar acima de −20.` };
  if (dCtl > 2 && tsb <= -5) return { nivel:'ok',
    txt:`Bloco de carga funcionando: CTL +${dCtl} pts em 14 dias com TSB em ${tsb} — sobrecarga na faixa produtiva (−10 a −25). É exatamente assim que fitness se constrói: fadiga controlada agora, supercompensação no próximo deload. Não acelere o processo.` };
  if (dCtl > 2 && tsb > 5) return { nivel:'ok',
    txt:`CTL +${dCtl} pts em 14 dias e TSB positivo (${tsb}) — você está absorvendo a carga com folga. Se isso persistir fora de deload, há espaço pra progredir o volume das sessões-chave.` };
  if (dCtl < -2) return { nivel:'atencao',
    txt:`CTL caindo (${dCtl} pts em 14 dias): a base crônica está encolhendo. Se for deload/taper planejado, perfeito — frescor revela forma. Se não for, a consistência caiu e cada semana parada custa ~7–10% da adaptação recente.` };
  return { nivel:'info',
    txt:`CTL estável (${dCtl>=0?'+':''}${dCtl} pts/14d) com TSB em ${tsb}. Manutenção: sustenta a forma, mas não cria estímulo novo. Pro limiar subir até ~4:45/km, o CTL precisa de tendência ascendente nos blocos de carga.` };
}

function lerACWR(serie) {
  const s = serie.filter(d=>d.acwr!=null);
  if (s.length < 5) return null;
  const a = s[s.length-1].acwr;
  const sl = slopeOf(s.slice(-10).map(d=>d.acwr));
  const rumo = sl==null?'' : sl>0.015?' e subindo rápido' : sl<-0.015?' e caindo':'';
  if (a > 1.5) return { nivel:'alerta',
    txt:`ACWR em ${a}${rumo}: a carga aguda está ${Math.round((a-1)*100)}% acima da tua base crônica — a zona onde o risco de lesão dispara (Gabbett). Próximos 3–4 dias: só Z2 e cross, sem qualidade, até voltar pra baixo de 1.3.` };
  if (a > 1.3) return { nivel:'atencao',
    txt:`ACWR em ${a}${rumo} — acima da zona ótima (0.8–1.3). Um salto de volume recente. Segure o volume desta semana no mesmo patamar da anterior; a base crônica alcança em ~7–10 dias.` };
  if (a < 0.8) return { nivel:'atencao',
    txt:`ACWR em ${a}: carga aguda bem abaixo da crônica. Em deload isso é o objetivo; fora dele, é destreino silencioso — e a volta abrupta depois é o cenário clássico de lesão. Retome progressivo (+10%/sem).` };
  return { nivel:'ok',
    txt:`ACWR em ${a}${rumo} — dentro da zona ótima (0.8–1.3): a carga cresce num ritmo que teus tecidos acompanham. Lembre que o ACWR isolado prediz pouco (Griffin 2020); leia junto com monotonia e prontidão.` };
}

function lerBaselineMetrica(m, bl) {
  const serie = bl.serie, r = bl.resumo;
  if (r.atual == null || r.media == null || r.n < 5) return null;
  const ult = serie[serie.length-1] || {};
  const vals7 = serie.slice(-7).map(d=>d.valor);
  const sl = slopeOf(vals7);
  const slSem = sl!=null ? +(sl*7).toFixed(1) : null;
  const delta = r.atual - r.media;
  const fora = ult.baseLo!=null && (r.atual < ult.baseLo || r.atual > ult.baseHi);
  const dir = sl==null?'estável' : (m.inv ? (sl>0?'piorando':'melhorando') : (sl>0?'subindo':'caindo'));

  if (m.k==='rmssd') {
    if (fora && delta<0) return { nivel:'alerta', txt:`rMSSD em ${r.atual}ms — abaixo da banda −1SD (base ${r.media.toFixed(0)}ms)${slSem!=null?`, tendência de ${slSem>0?'+':''}${slSem}ms/sem`:''}. Supressão parassimpática: resposta típica a carga acumulada + sono curto. 24–48h de treino leve costumam devolver a curva à banda; se não devolver, o problema é maior que um dia ruim.` };
    if (sl!=null && sl<-0.6) return { nivel:'atencao', txt:`HRV ${dir} (~${slSem}ms/sem) mesmo dentro da banda. Queda sustentada de rMSSD antecipa fadiga antes da percepção subjetiva — é o teu sinal mais precoce. Proteja o sono nesta semana e observe a resposta ao próximo deload.` };
    return { nivel:'ok', txt:`rMSSD em ${r.atual}ms, dentro da banda da base 28d (${r.media.toFixed(0)}ms) e ${dir}. Sistema autonômico absorvendo a carga — luz verde pras sessões-chave.` };
  }
  if (m.k==='fc') {
    if (fora && delta>0) return { nivel:'alerta', txt:`FC repouso em ${r.atual}bpm — acima da banda +1SD (base ${r.media.toFixed(0)}bpm). Elevação de FCR + HRV baixo é a dupla clássica de recuperação incompleta (às vezes também início de infecção). Corte a intensidade hoje e reavalie amanhã cedo.` };
    if (sl!=null && sl>0.35) return { nivel:'atencao', txt:`FC repouso subindo ~${slSem}bpm/sem. Ainda na banda, mas a direção importa mais que o valor: elevação gradual de FCR acompanha acúmulo de fadiga simpática. Cruze com o débito de sono antes de culpar o treino.` };
    return { nivel:'ok', txt:`FC repouso em ${r.atual}bpm, na banda da base (${r.media.toFixed(0)}bpm). Recuperação cardiovascular em dia.` };
  }
  if (m.k==='sonoDuracao') {
    if (r.atual < 6.5 || (sl!=null && sl<-0.12)) return { nivel:'atencao', txt:`Duração de sono ${dir}${slSem!=null?` (~${slSem}h/sem)`:''}, última noite ${r.atual}h vs. base ${r.media.toFixed(1)}h. Sono é onde a adaptação acontece — GH e síntese proteica são majoritariamente noturnos. Abaixo de 7h, a mesma sessão gera menos ganho e mais custo.` };
    return { nivel:'ok', txt:`Sono em ${r.atual}h (base ${r.media.toFixed(1)}h) e ${dir}. A janela de 8h é o teu suplemento mais barato — mantenha.` };
  }
  if (m.k==='sonoEficiencia') {
    if (fora && delta<0) return { nivel:'atencao', txt:`Eficiência do sono em ${r.atual}% — abaixo da banda (base ${r.media.toFixed(0)}%). Tempo na cama não está virando sono. Olhe cafeína após 14h, telas e horário da última refeição antes de mexer no treino.` };
    return { nivel:'ok', txt:`Eficiência em ${r.atual}% (base ${r.media.toFixed(0)}%) — sono rendendo bem.` };
  }
  if (m.k==='estresseSono') {
    if (fora && delta<0) return { nivel:'atencao', txt:`Só ${r.atual}% da noite em baixo estresse (base ${r.media.toFixed(0)}%). Noite fisiologicamente agitada — recuperação noturna comprometida mesmo com duração ok. Se coincidir com treino tarde + intenso, considere antecipar as sessões fortes.` };
    return { nivel:'ok', txt:`${r.atual}% da noite em baixo estresse (base ${r.media.toFixed(0)}%) — recuperação noturna limpa.` };
  }
  return null;
}

function lerProntidaoChart(prontSerie) {
  const p = prontSerie.filter(d=>d.prontidao!=null);
  if (p.length < 5) return null;
  const ult = p[p.length-1];
  const sl = slopeOf(p.slice(-7).map(d=>d.prontidao));
  const slSem = sl!=null ? Math.round(sl*7) : null;
  const pior = ult.partes ? [...ult.partes].sort((a,b)=>a.v-b.v)[0] : null;
  const driver = pior ? ` O componente que mais pesa contra hoje é ${pior.k} (${Math.round(pior.v)}/100).` : '';
  if (ult.prontidao < 50) return { nivel:'alerta', txt:`Prontidão em ${ult.prontidao}${slSem!=null?`, ${slSem>=0?'+':''}${slSem} pts/sem`:''}.${driver} Abaixo de 50, sessão-chave vira fadiga sem estímulo — troque por Z2 e ataque a causa, não o sintoma.` };
  if (sl!=null && sl<-1.2) return { nivel:'atencao', txt:`Prontidão caindo ~${Math.abs(slSem)} pts/sem (hoje ${ult.prontidao}).${driver} Queda sustentada em bloco de carga é esperada até certo ponto — o que não pode é a curva continuar caindo depois do deload.` };
  return { nivel:'ok', txt:`Prontidão em ${ult.prontidao}${slSem!=null?` e ${slSem>=0?'subindo/estável':'em leve queda'} (${slSem>=0?'+':''}${slSem} pts/sem)`:''}.${driver||' Todos os sistemas respondendo.'}` };
}

function lerZonasTreinos(treinos) {
  const rec = [...treinos].sort((a,b)=>a.data<b.data?1:-1).slice(0,5);
  if (rec.length < 2) return null;
  const cinzaMed = rec.reduce((a,t)=>a+(t.zonas?.CINZA||0),0)/rec.length;
  const facils = rec.filter(t => { const p = sessaoDoDia(t.data); return p && (p.tipo==='Fácil'||p.tipo==='Longo'); });
  const cinzaFacil = facils.length ? facils.reduce((a,t)=>a+(t.zonas?.CINZA||0)+(t.zonas?.LT2||0),0)/facils.length : null;
  if (cinzaFacil!=null && cinzaFacil > 15) return { nivel:'atencao',
    txt:`Nos dias fáceis/longos recentes, ${cinzaFacil.toFixed(0)}% do tempo escapou pra cinza+LT2 — o padrão de pace fugindo pra cima continua. Zona cinza (163–167) custa recuperação de treino forte e devolve adaptação de treino fraco. Trave a FC em 162 e aceite o pace que vier.` };
  if (cinzaMed > 20) return { nivel:'atencao',
    txt:`Média de ${cinzaMed.toFixed(0)}% do tempo em zona cinza nas últimas corridas. Polarize: fácil de verdade nos dias fáceis, forte de verdade nas chaves.` };
  return { nivel:'ok', txt:`Distribuição de zonas disciplinada nas últimas corridas (cinza média ${cinzaMed.toFixed(0)}%). A polarização está funcionando — é ela que permite o limiar subir.` };
}

function lerCargaModalidade(serie14) {
  const run = serie14.reduce((a,d)=>a+(d.cargaCorrida||0),0);
  const musc = serie14.reduce((a,d)=>a+(d.cargaMuscu||0),0);
  const tot = run+musc;
  if (!tot) return null;
  const pMusc = Math.round(musc/tot*100);
  if (pMusc > 45) return { nivel:'atencao', txt:`Musculação respondendo por ${pMusc}% da carga total dos 14 dias. Pra um ciclo cujo objetivo é o 5km, a corrida deve dominar o estresse — se a força está competindo por recuperação, é ela que cede primeiro (a fase da força já prevê isso).` };
  if (pMusc < 15 && musc>0) return { nivel:'info', txt:`Força em só ${pMusc}% da carga de 14 dias. Em fase plena (M1–M2), manter o estímulo de força protege massa magra durante o fat loss — não deixe cair por acaso, só por planejamento.` };
  return { nivel:'ok', txt:`Divisão corrida ${100-pMusc}% / força ${pMusc}% nos últimos 14 dias — proporção coerente com um híbrido priorizando o 5km sem abrir mão da massa magra.` };
}

/* Eficiência aeróbica (EF): velocidade (m/min) ÷ FC média — TrainingPeaks/Maffetone.
   Só comparável entre esforços da mesma natureza: filtramos rodagens (≥55% em Z1+Z2+LT1).
   EF subindo à mesma FC = base aeróbica melhorando de verdade, independente de motivação. */
function calcEF(treinos) {
  return [...treinos]
    .filter(t => t.fcMedia > 0 && t.paceSeg > 0)
    .map(t => ({
      data: t.data,
      ef: +(((1000 / t.paceSeg) * 60) / t.fcMedia).toFixed(3),
      facil: ((t.zonas?.Z1||0) + (t.zonas?.Z2||0) + (t.zonas?.LT1||0)) >= 55,
    }))
    .sort((a,b) => a.data.localeCompare(b.data));
}
function lerEF(efSerie) {
  const f = efSerie.filter(e => e.facil);
  if (f.length < 3) return { nivel:'info',
    txt:'A eficiência aeróbica (metros por batimento) precisa de pelo menos 3 rodagens fáceis comparáveis pra virar tendência. Siga registrando — essa curva é o termômetro mais honesto da base.' };
  const vals = f.slice(-8).map(e => e.ef);
  const sl = slopeOf(vals);
  if (sl == null) return { nivel:'info', txt:'Ainda faltam pontos comparáveis pra ler a tendência da eficiência aeróbica.' };
  const pctSes = sl / (vals[0] || 1) * 100;
  if (pctSes > 0.35) return { nivel:'ok',
    txt:`Eficiência aeróbica subindo ~${pctSes.toFixed(1)}% por rodagem: mais pace pelo mesmo custo cardíaco. É o sinal mais limpo de base melhorando — o limiar vem atrás dele.` };
  if (pctSes < -0.5) return { nivel:'atencao',
    txt:`Eficiência aeróbica caindo ~${Math.abs(pctSes).toFixed(1)}% por rodagem — o mesmo pace está custando mais batimento. Descarte calor e desidratação primeiro; se persistir com sono ok, é fadiga acumulada falando antes de virar lesão.` };
  return { nivel:'ok',
    txt:'Eficiência aeróbica estável nas rodagens recentes — custo cardíaco sob controle. Em déficit calórico, manter esse número já é vitória.' };
}

/* Sono × HRV — resposta individual: rMSSD da manhã seguinte a noites curtas vs cheias */
function lerSonoHRV(diario) {
  const dias = Object.keys(diario).sort();
  const curtos = [], longos = [];
  dias.forEach(d => {
    const e = diario[d];
    if (e?.sonoDuracao == null) return;
    const nx = new Date(d + 'T12:00:00'); nx.setDate(nx.getDate() + 1);
    const r = diario[nx.toISOString().slice(0,10)]?.rmssd;
    if (r == null) return;
    if (e.sonoDuracao < 6.5) curtos.push(r);
    else if (e.sonoDuracao >= 7.5) longos.push(r);
  });
  if (curtos.length < 3 || longos.length < 3) return null;
  const m = a => a.reduce((x,y)=>x+y,0) / a.length;
  const mc = m(curtos), ml = m(longos);
  const dif = ml ? (ml - mc) / ml * 100 : 0;
  if (dif >= 8) return { nivel:'atencao',
    txt:`Padrão individual detectado: após noites <6h30, teu rMSSD da manhã roda em média ${Math.round(dif)}% abaixo do que roda após noites ≥7h30 (${mc.toFixed(0)} vs ${ml.toFixed(0)} ms, n=${curtos.length}/${longos.length}). No teu corpo, sono curto tem preço autonômico mensurável — a cama é parte do plano de treino.` };
  return { nivel:'ok',
    txt:`Teu rMSSD tem se mostrado resiliente a noites curtas isoladas (diferença média de ${Math.max(0, Math.round(dif))}% vs noites cheias). O risco no teu caso é o débito acumulado, não a noite ruim pontual.` };
}

/* Próximo teste no macrociclo — varre o plano à frente */
function proximoTeste() {
  const hoje = new Date(hojeISO() + 'T12:00:00');
  for (let i = 0; i < 420; i++) {
    const d = new Date(hoje); d.setDate(hoje.getDate() + i);
    const iso = d.toISOString().slice(0,10);
    const s = sessaoDoDia(iso);
    if (s?.tipo === 'Teste') return { iso, dias: i, s };
  }
  return null;
}

/* Diagnóstico integrado — o parecer que cruza todos os sinais, priorizado por severidade */
function diagnosticoCoach({ ultimo, monoStrain, debitoSono, prontSerie, serie, treinos, sessaoHoje, baselines, efSerie, sonoHRV, proxTeste }) {
  const itens = [];
  const push = (nivel, titulo, txt) => itens.push({ nivel, titulo, txt });

  const pmc = lerPMC(serie);
  const acwr = lerACWR(serie);
  const pront = lerProntidaoChart(prontSerie);
  const zonas = lerZonasTreinos(treinos);

  /* 1. risco agudo primeiro */
  if (ultimo?.tsb!=null && ultimo.tsb < -25) push('alerta','Fadiga profunda', pmc.txt);
  if (acwr && acwr.nivel==='alerta') push('alerta','Pico de carga aguda', acwr.txt);
  if (debitoSono && debitoSono.debitoH >= 7) push('alerta','Débito de sono crítico',
    `${debitoSono.debitoH}h de débito em 7 dias (média ${debitoSono.mediaH}h/noite) — o equivalente a uma noite inteira perdida, e o efeito é sub-percebido (Van Dongen 2003). Antes da próxima chave: 1–2 noites de 9h+. Sono curto derruba HRV, sobe FCR e corta a síntese proteica que segura tua massa magra no déficit.`);
  const hrvLeit = baselines?.rmssd ? lerBaselineMetrica({k:'rmssd',inv:false}, baselines.rmssd) : null;
  if (hrvLeit && hrvLeit.nivel==='alerta') push('alerta','HRV suprimido', hrvLeit.txt);

  /* 2. atenção */
  if (monoStrain && monoStrain.monotonia >= 2.0) push('atencao','Carga monótona',
    `Monotonia em ${monoStrain.monotonia} (strain ${monoStrain.strain}): os dias estão parecidos demais entre si. Foster mostrou que a falta de contraste leve↔forte é fator de risco independente do volume total. Faça os fáceis mais fáceis — o contraste é o que permite os fortes serem fortes.`);
  if (acwr && acwr.nivel==='atencao') push('atencao','ACWR', acwr.txt);
  if (zonas && zonas.nivel==='atencao') push('atencao','Disciplina de zonas', zonas.txt);
  if (pront && pront.nivel!=='ok') push(pront.nivel==='alerta'?'alerta':'atencao','Prontidão', pront.txt);
  if (debitoSono && debitoSono.debitoH >= 3 && debitoSono.debitoH < 7) push('atencao','Sono acumulando débito',
    `${debitoSono.debitoH}h de débito na janela de 7d (média ${debitoSono.mediaH}h/noite, meta 8h). Ainda administrável, mas em bloco de carga o sono é metade do treino.`);

  if (sonoHRV && sonoHRV.nivel==='atencao') push('atencao','Sono × HRV — padrão individual', sonoHRV.txt);
  const ef = efSerie ? lerEF(efSerie) : null;
  if (ef && ef.nivel==='atencao') push('atencao','Eficiência aeróbica caindo', ef.txt);
  if (proxTeste && proxTeste.dias <= 10 && proxTeste.dias > 0) push('atencao','Afiação pré-teste',
    `Teste 5k em ${proxTeste.dias} dia(s) — ${proxTeste.iso.split('-').reverse().join('/')}. Janela de afiação: corte ~40% do volume, mantenha 2 toques curtos de intensidade (4–6×1min em ritmo de prova, recuperação generosa), zero exercício novo. Alvo: chegar com TSB entre −5 e +10 e duas noites cheias de sono na véspera.`);

  /* 3. o que vai bem */
  if (pmc.nivel==='ok') push('ok','Bloco de carga', pmc.txt);
  if (acwr && acwr.nivel==='ok') push('ok','Progressão de carga', acwr.txt);
  if (zonas && zonas.nivel==='ok') push('ok','Distribuição de intensidade', zonas.txt);
  if (pront && pront.nivel==='ok') push('ok','Prontidão', pront.txt);
  if (ef && ef.nivel==='ok') push('ok','Motor aeróbico', ef.txt);
  if (sonoHRV && sonoHRV.nivel==='ok') push('ok','Resiliência autonômica', sonoHRV.txt);

  /* 4. recomendação-síntese do dia */
  let sintese = null;
  const r = ultimo?.prontidao;
  if (sessaoHoje && r!=null) {
    const alertas = itens.filter(i=>i.nivel==='alerta').length;
    if (sessaoHoje.tipo==='Chave'||sessaoHoje.tipo==='Teste') {
      sintese = alertas>0 || r<50
        ? `Hoje é dia de ${sessaoHoje.titulo}, mas os sinais acima pedem prudência: execute no piso da faixa, corte um bloco, ou troque por Z2 se a FC escalar nos primeiros minutos. Um dia-chave adiado se recupera; um buraco de 2 semanas, não.`
        : r>=70
          ? `Sinais alinhados pra qualidade: ${sessaoHoje.titulo} como planejado (${sessaoHoje.detalhe}). Comece pelo limite lento da faixa e deixe a FC estabilizar — a sessão é ganha nos últimos blocos, não nos primeiros.`
          : `Prontidão intermediária (${r}) pra ${sessaoHoje.titulo}: vale treinar, mas no piso da faixa e com um bloco a menos se a FC escalar.`;
    } else if (sessaoHoje.tipo==='Longo') {
      sintese = r>=60 ? `Longo como planejado (${sessaoHoje.detalhe}) — comece bem fácil e só aperte no terço final.` : `Prontidão ${r}: encurte o longo em 20–30% e fique na base do pace.`;
    } else {
      sintese = `Dia ${sessaoHoje.tipo.toLowerCase()} — perfeito pra consolidar: quanto mais fácil hoje, melhor a próxima chave.`;
    }
  }

  if (proxTeste && proxTeste.dias <= 3 && sintese) sintese = `T−${proxTeste.dias} pro teste 5k. ` + sintese;
  return { itens: itens.slice(0,7), sintese };
}

/* Anel de prontidão — arco suave com glow, assinatura visual */
function Ring({ score, size=128, label='Prontidão' }) {
  const stroke = 9, r = (size - stroke - 8)/2, cx=size/2, cy=size/2;
  const circ = 2*Math.PI*r;
  const pct = score==null?0:clamp(score,0,100)/100;
  const c = score==null?T.t3 : score>=75?T.mint : score>=50?T.amber:T.red;
  return (
    <div style={{ position:'relative', width:size, height:size, flexShrink:0 }}>
      <svg width={size} height={size} style={{ transform:'rotate(-90deg)' }}>
        <circle cx={cx} cy={cy} r={r} stroke={T.brd} strokeWidth={stroke} fill="none"/>
        <circle cx={cx} cy={cy} r={r} stroke={c} strokeWidth={stroke} fill="none"

/* ═══════════════════════ APP ═══════════════════════ */
function App() {
  const [diario, setDiario] = useState(SEED_DIARIO);
  const [treinos, setTreinos] = useState(SEED_TREINOS);
  const [aba, setAba] = useState('hoje');
  const [dataSel, setDataSel] = useState(hojeISO());
  const [mesRef, setMesRef] = useState(() => { const d=new Date(); return { a:d.getFullYear(), m:d.getMonth() }; });
  const [toast, setToast] = useState(null);
  const [openExec, setOpenExec] = useState(true);
  const [openForca, setOpenForca] = useState(false);
  const [showImport, setShowImport] = useState(false);
  const [openProto, setOpenProto] = useState(false);
  const [importText, setImportText] = useState('');

  useEffect(() => { (async () => {
    try {
      let raw = null;
      if (window.storage?.get) { try { const r = await window.storage.get('monitor_v2'); raw = r?.value ?? null; } catch {} }
      if (raw == null) { try { raw = localStorage.getItem('monitor_v2'); } catch {} }
      if (raw) { const d = JSON.parse(raw); setDiario(d.diario||SEED_DIARIO); setTreinos(d.treinos||SEED_TREINOS); }
    } catch {}
  })(); }, []);
  const salvar = useCallback(async (d,t) => {
    const raw = JSON.stringify({ diario:d, treinos:t });
    if (window.storage?.set) { try { await window.storage.set('monitor_v2', raw); return; } catch {} }
    try { localStorage.setItem('monitor_v2', raw); } catch {}
  }, []);
  const flash = m => { setToast(m); setTimeout(()=>setToast(null), 3600); };

  const serie = useMemo(() => {
    const ds = Object.keys(diario).sort();
    if (!ds.length) return [];
    const ini = new Date(ds[0]+'T12:00:00'), fim = new Date(hojeISO()+'T12:00:00');
    const out = [];
    for (let d=new Date(ini); d<=fim; d.setDate(d.getDate()+1)) {
      const iso = d.toISOString().slice(0,10);
      out.push({ data:iso, ...(diario[iso]||{}) });
    }
    return calcPMC(out);
  }, [diario]);

  const prontSerie = useMemo(() => serie.map((d,i) => {
    const hist = serie.slice(Math.max(0,i-28), i).filter(x=>x.rmssd!=null||x.fc!=null);
    const p = calcProntidao(d, hist);
    return { ...d, prontidao:p?.score ?? null, partes:p?.parts };
  }), [serie]);

  const ultimo = [...prontSerie].reverse().find(d=>d.prontidao!=null);
  const monoStrain = useMemo(() => calcMonotoniaStrain(serie.slice(-7)), [serie]);
  const debitoSono = useMemo(() => calcDebitoSono(serie.slice(-7)), [serie]);
  const acwrSt = acwrStatus(ultimo?.acwr);
  const sessaoHoje = sessaoDoDia(hojeISO());
  const sessaoForcaHoje = forcaDoDiaAdaptada(hojeISO());
  const posHoje = posMacro(hojeISO());

  const BASE_METRICAS = [
    { k:'rmssd', l:'HRV (rMSSD)', u:'ms', c:T.violet, inv:false, icon:HeartPulse },
    { k:'fc', l:'FC repouso', u:'bpm', c:T.rasp, inv:true, icon:Activity },
    { k:'estresseSono', l:'Baixo estresse no sono', u:'%', c:T.cyan, inv:false, icon:Moon },
    { k:'sonoEficiencia', l:'Eficiência do sono', u:'%', c:T.mint, inv:false, icon:Moon },
    { k:'sonoDuracao', l:'Duração do sono', u:'h', c:T.blue, inv:false, icon:Moon },
  ];
  const baselines = useMemo(() => {
    const out = {};
    for (const m of BASE_METRICAS) out[m.k] = { serie: baselineSerie(serie, m.k, m.inv), resumo: resumoBaseline(serie, m.k) };
    return out;
  }, [serie]);

  const tendencia = useMemo(() => {
    const p = prontSerie.filter(d=>d.prontidao!=null).slice(-7).map(d=>d.prontidao);
    if (p.length<4) return null;
    const a=p.slice(0,Math.floor(p.length/2)), b=p.slice(-Math.floor(p.length/2));
    return Math.round(b.reduce((x,y)=>x+y,0)/b.length - a.reduce((x,y)=>x+y,0)/a.length);
  }, [prontSerie]);

  const treinosOrd = useMemo(() =>
    [...treinos].sort((a,b) =>
      (b.data + String(b.hora ?? 0).padStart(2,'0')).localeCompare(a.data + String(a.hora ?? 0).padStart(2,'0'))),
    [treinos]);
  const efSerie = useMemo(() => calcEF(treinos), [treinos]);
  const leituraEF = useMemo(() => lerEF(efSerie), [efSerie]);
  const sonoHRV = useMemo(() => lerSonoHRV(diario), [diario]);
  const proxTeste = useMemo(() => proximoTeste(), []);

  /* diagnóstico integrado do coach */
  const diag = useMemo(() => diagnosticoCoach({ ultimo, monoStrain, debitoSono, prontSerie, serie, treinos, sessaoHoje, baselines, efSerie, sonoHRV, proxTeste }),
    [ultimo, monoStrain, debitoSono, prontSerie, serie, treinos, baselines, efSerie, sonoHRV, proxTeste]);
  const leituraPMC = useMemo(() => lerPMC(serie), [serie]);
  const leituraACWR = useMemo(() => lerACWR(serie), [serie]);
  const leituraPront = useMemo(() => lerProntidaoChart(prontSerie), [prontSerie]);
  const leituraZonas = useMemo(() => lerZonasTreinos(treinos), [treinos]);
  const leituraModal = useMemo(() => lerCargaModalidade(serie.slice(-14)), [serie]);

  /* aderência da semana corrente */
  const aderenciaSemana = useMemo(() => {
    const hoje = new Date(hojeISO()+'T12:00:00');
    const dow = hoje.getDay();
    const seg = new Date(hoje); seg.setDate(hoje.getDate() - ((dow+6)%7));
    const dias = Array.from({length:7}, (_,i) => { const d=new Date(seg); d.setDate(seg.getDate()+i); return d.toISOString().slice(0,10); });
    const linhas = dias
      .filter(iso => iso <= hojeISO())
      .map(iso => {
        const plano = sessaoDoDia(iso);
        if (!plano) return null;
        const tr = treinos.find(t => t.data === iso);
        const val = tr ? validar(plano, tr) : null;
        return { iso, dow:new Date(iso+'T12:00:00').getDay(), plano, tr, val };
      })
      .filter(Boolean);
    const chaves = linhas.filter(l => l.plano.tipo==='Chave' || l.plano.tipo==='Teste');
    const faceis = linhas.filter(l => l.plano.tipo==='Fácil');
    const cont = arr => ({
      feito: arr.filter(l => l.val).length,
      cumprido: arr.filter(l => l.val && l.val.total>=90).length,
      total: arr.length,
    });
    return { linhas, chaves:cont(chaves), faceis:cont(faceis) };
  }, [treinos, diario]);

  const setCampo = (campo,valor) => {
    const v = valor===''?null:Number(valor);
    const novo = { ...diario, [dataSel]:{ ...(diario[dataSel]||{}), [campo]:v } };
    setDiario(novo); salvar(novo, treinos);
  };
  const exportar = () => {
    const blob = new Blob([JSON.stringify({ v:5, exported:new Date().toISOString(), entries:diario, treinos }, null, 2)], { type:'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = `monitor-${hojeISO()}.json`; a.click();
    URL.revokeObjectURL(a.href); flash('Arquivo exportado');
  };
  const dedupeTreinos = list => {
    const out = [];
    for (const tr of list) {
      const dup = out.find(o =>
        o.data === tr.data && Math.abs((o.hora??0) - (tr.hora??0)) <= 0 &&
        Math.abs((o.distKm||0) - (tr.distKm||0)) < 0.15
      );
      if (!dup) { out.push(tr); continue; }
      const scoreOf = x => (x.zonas?Object.keys(x.zonas).length:0) + (x.cadencia?1:0) + (x.fcMedia?1:0);
      if (scoreOf(tr) > scoreOf(dup)) { out[out.indexOf(dup)] = tr; }
    }
    return out;
  };
  const processarImport = (raw) => {
    if (!raw || !raw.trim()) { flash('Cole o JSON antes de processar'); return; }
    try {
      const j = JSON.parse(raw);
      const d = j.entries || j.diario || {};
      const tRaw = j.treinos ? [...treinos, ...j.treinos] : treinos;
      const t = dedupeTreinos(tRaw);
      const removidos = tRaw.length - t.length;
      const nDias = Object.keys(d).length;
      setDiario(prev => { const m = { ...prev, ...d }; salvar(m, t); return m; });
      if (j.treinos) setTreinos(t);
      if (nDias === 0 && !j.treinos) { flash('JSON válido, mas sem "entries" nem "treinos" reconhecidos'); return; }
      flash(`${nDias} dia(s) + ${j.treinos?.length||0} treino(s) importados${removidos>0?` · ${removidos} duplicata(s) removida(s)`:''}`);
      setShowImport(false); setImportText('');
    } catch (err) {
      flash('JSON inválido — confira se copiou o bloco completo');
    }
  };
  const importarArquivo = e => {
    const f = e.target.files?.[0]; if (!f) return;
    const rd = new FileReader();
    rd.onload = () => processarImport(rd.result);
    rd.onerror = () => flash('Não consegui ler o arquivo');
    rd.readAsText(f); e.target.value = '';
  };
  const colarClipboard = async () => {
    try {
      const txt = await navigator.clipboard.readText();
      setImportText(txt);
      flash('Colado — confira e clique em Processar');
    } catch {
      flash('Sem permissão de clipboard — cole manualmente no campo (Ctrl/Cmd+V)');
    }
  };
  const aplicarSRPE = tr => {
    const c = calcSRPE(tr);
    if (!c) { flash('Treino sem FC — sRPE não calculável'); return; }
    const novo = { ...diario, [tr.data]:{ ...(diario[tr.data]||{}), cargaCorrida:c.srpe } };
    setDiario(novo); salvar(novo, treinos);
    const ds = Object.keys(novo).sort();
    const ini = new Date(ds[0]+'T12:00:00'), fim = new Date(hojeISO()+'T12:00:00');
    const out = [];
    for (let d=new Date(ini); d<=fim; d.setDate(d.getDate()+1)) {
      const iso = d.toISOString().slice(0,10);
      out.push({ data:iso, ...(novo[iso]||{}) });
    }
    const pmc = calcPMC(out);
    const last = pmc[pmc.length-1];
    flash(`sRPE ${c.srpe} gravado em ${tr.data} · TSB agora ${last?.tsb ?? '—'} · ACWR ${last?.acwr ?? '—'}`);
  };

  /* veredito cruzando plano × prontidão */
  const veredito = useMemo(() => {
    const s = sessaoHoje, r = ultimo?.prontidao;
    if (!s) return { c:T.t3, txt:'Fora do macrociclo — o plano começa em 06/07/2026.' };
    if (r == null) return { c:T.t3, txt:'Registre os dados de hoje no Diário para receber a leitura cruzada.' };
    if (s.tipo==='Chave' || s.tipo==='Teste') {
      if (r>=70 && (ultimo.acwr ?? 1)<=1.5) return { c:T.mint, txt:`Prontidão ${r} — siga o plano como está.` };
      if (r>=50) return { c:T.amber, txt:`Prontidão ${r} — pode treinar, mas no piso da faixa ou com um bloco a menos. Pare se a FC escalar.` };
      return { c:T.red, txt:`Prontidão ${r} — troque por Z2 fácil. Dia-chave com prontidão baixa vira fadiga sem estímulo.` };
    }
    if (s.tipo==='Longo')
      return r>=60 ? { c:T.mint, txt:`Prontidão ${r} — siga o longo como planejado.` }
                   : { c:T.amber, txt:`Prontidão ${r} — encurte 20–30% e fique na base do pace.` };
    return r<40 ? { c:T.amber, txt:`Dia leve já previsto — com prontidão em ${r}, mantenha bem fácil.` }
                : { c:T.mint, txt:`Siga como planejado.` };
  }, [sessaoHoje, ultimo]);

  const abas = [
    { k:'hoje', n:'Hoje', I:Gauge }, { k:'diario', n:'Diário', I:NotebookPen },
    { k:'baselines', n:'Baselines', I:HeartPulse }, { k:'carga', n:'Carga', I:BarChart3 },
    { k:'treinos', n:'Treinos', I:Footprints }, { k:'plano', n:'Plano', I:CalendarDays },
    { k:'sync', n:'Strava', I:MessageSquareText },
  ];
  const progMeso = posHoje ? (posHoje.nSem-1)/posHoje.totalSem : 0;

  return (
    <div style={{ minHeight:'100vh', background:T.bg, color:T.t1, fontFamily:T.sans, paddingBottom:70 }}>

      {/* ═══ HEADER / HERO ═══ */}
      <header style={{ position:'sticky', top:0, zIndex:30,
                       background:'rgba(15,17,22,.86)', backdropFilter:'blur(12px)',
                       borderBottom:`1px solid ${T.brd}` }}>
        <div style={{ maxWidth:720, margin:'0 auto', padding:'14px 18px 0', position:'relative', overflow:'hidden' }}>
          <div style={{ position:'absolute', top:-70, right:-60, width:220, height:220, borderRadius:'50%',
                        background:`radial-gradient(circle, ${posHoje?posHoje.meso.cor:T.coral}1F, transparent 68%)`, pointerEvents:'none' }}/>
          <div style={{ display:'flex', alignItems:'flex-start', justifyContent:'space-between', marginBottom:10, gap:10 }}>
            <div style={{ minWidth:0 }}>
              <div style={{ display:'flex', alignItems:'center', gap:8, flexWrap:'wrap' }}>
                <Eyebrow c={T.coral} icon={Timer}>Macrociclo 2026–27</Eyebrow>
                <Pill cor={T.coral} solid>Sub-20</Pill>
              </div>
              <div style={{ fontFamily:T.disp, fontSize:27, letterSpacing:.6, marginTop:4, lineHeight:1 }}>
                {posHoje ? `${posHoje.meso.k} · ${posHoje.meso.nome}` : 'Monitor Atleta'}
              </div>
              {posHoje && (
                <div style={{ fontSize:10.5, color:T.t3, fontFamily:T.mono, marginTop:4 }}>
                  Semana {posHoje.nSem}/{posHoje.totalSem} · {posHoje.semana.fase} · meta {posHoje.meso.meta}
                </div>
              )}
            </div>
            <div style={{ display:'flex', gap:6, flexShrink:0 }}>
              <button onClick={()=>setShowImport(v=>!v)} style={{
                background: showImport?T.coral:T.lift, color: showImport?T.deep:T.t2,
                border:`1px solid ${showImport?T.coral:T.brd2}`, borderRadius:8, padding:'7px 11px',
                fontSize:11, fontWeight:700, cursor:'pointer', display:'flex', alignItems:'center', gap:5 }}>
                <Upload size={13}/>Importar
              </button>
              <button onClick={exportar} style={{ background:T.lift, border:`1px solid ${T.brd2}`, borderRadius:8,
                padding:'7px 11px', fontSize:11, fontWeight:700, cursor:'pointer', color:T.t2,
                display:'flex', alignItems:'center', gap:5 }}>
                <Download size={13}/>Exportar
              </button>
            </div>
          </div>
          {posHoje && (
            <div style={{ height:3, background:T.brd, borderRadius:2, marginBottom:10, overflow:'hidden' }}>
              <div style={{ width:`${Math.round(progMeso*100)}%`, height:'100%',
                            background:`linear-gradient(90deg, ${posHoje.meso.cor}88, ${posHoje.meso.cor})` }}/>
            </div>
          )}
          {showImport && (
            <div style={{ background:T.lift, border:`1px solid ${T.brd2}`, borderRadius:11, padding:13, marginBottom:12 }}>
              <Eyebrow c={T.coral} icon={Upload}>Colar JSON de sincronização</Eyebrow>
              <div style={{ fontSize:10.5, color:T.t3, margin:'5px 0 8px', lineHeight:1.5 }}>
                Peça no chat com o prompt da aba "Strava" e cole a resposta do Claude aqui.
              </div>
              <textarea value={importText} onChange={e=>setImportText(e.target.value)}
                placeholder='{"entries": {...}, "treinos": [...]}'
                rows={5}
                style={{ width:'100%', background:T.card, border:`1px solid ${T.brd2}`, borderRadius:8,
                         padding:'8px 10px', color:T.t1, fontSize:11, fontFamily:T.mono, resize:'vertical',
                         outline:'none' }} />
              <div style={{ display:'flex', gap:6, marginTop:8, flexWrap:'wrap' }}>
                <button onClick={colarClipboard} style={{
                  background:T.card, border:`1px solid ${T.brd2}`, borderRadius:8, padding:'7px 11px',
                  fontSize:11, fontWeight:600, color:T.t2, cursor:'pointer' }}>
                  Colar da área de transferência
                </button>
                <button onClick={()=>processarImport(importText)} style={{
                  background:`linear-gradient(135deg, ${T.coral}, #E6532F)`, border:'none', borderRadius:8, padding:'7px 14px',
                  fontSize:11, fontWeight:800, color:T.deep, cursor:'pointer', flex:1, minWidth:110 }}>
                  Processar
                </button>
                <label style={{ background:T.card, border:`1px solid ${T.brd2}`, borderRadius:8,
                                padding:'7px 11px', fontSize:11, fontWeight:600, color:T.t2, cursor:'pointer' }}>
                  Arquivo…
                  <input type="file" accept=".json" onChange={importarArquivo} style={{ display:'none' }}/>
                </label>
              </div>
            </div>
          )}
          <nav style={{ display:'flex', gap:2, overflowX:'auto' }}>
            {abas.map(a => (

                      <div style={{ fontSize:10.5, color:T.t2, marginTop:8, paddingTop:8, borderTop:`1px solid ${T.brd}` }}>
                        <span style={{ color:T.t3 }}>Plano {plano.meso.k} S{plano.nSem}: </span>
                        <span style={{ color:plano.lib.cor }}>{plano.titulo}</span>
                        {plano.detalhe!==plano.titulo && ` — ${plano.detalhe}`}
                        <span style={{ color:T.t3, fontFamily:T.mono }}> · FC {plano.fc[0]}–{plano.fc[1]} · ~{plano.min}min</span>
                      </div>
                      {val.causa && (
                        <div style={{ fontSize:11.5, color:val.c, marginTop:8, paddingTop:8,
                                      borderTop:`1px solid ${T.brd}`, lineHeight:1.55 }}>
                          <span style={{ fontFamily:T.mono, fontWeight:700 }}>Por quê: </span>{val.causa}
                        </div>
                      )}
                    </div>
                  )}
                  <button onClick={()=>aplicarSRPE(tr)} disabled={jaAplicado}
                    style={{ width:'100%', background:jaAplicado?T.lift:`linear-gradient(135deg, ${T.coral}, #E6532F)`,
                             color:jaAplicado?T.t3:T.deep,
                             border:jaAplicado?`1px solid ${T.brd}`:'none', borderRadius:9, padding:'10px', fontSize:12, fontWeight:800,
                             cursor:jaAplicado?'default':'pointer' }}>
                    {jaAplicado?'sRPE já gravado no diário':'Gravar sRPE no diário'}
                  </button>
                </Card>
              );
            })}
          </>
        )}

        {/* ═══ PROMPT STRAVA ═══ */}
        {aba==='sync' && (() => {
          const PROMPT = `Sincronize meus treinos de corrida mais recentes do Strava que ainda não estejam no meu Monitor Atleta e devolva SOMENTE um bloco JSON (sem texto antes/depois) no schema abaixo, pronto pra eu colar no botão Importar do app.

Pra cada atividade de corrida (Run) nova:
1. Use list_activities pra achar as atividades recentes.
2. Use get_activity_streams com streams=["heart_rate","velocity_smooth","grade_smooth","altitude","cadence","distance"] e resolution=60.
3. Calcule: FC média e máxima, pace médio (segundos/km), altitude média, grade média absoluta, distribuição de zonas em % usando estas faixas de FC: Z1 ≤138, Z2 139–152, LT1 153–162, CINZA 163–167, LT2 168–174, VO2 ≥175.
4. Calcule o sRPE pelo método: RPE base pela FC média (tabela Foster) + modificador de altitude (+1,2 por 1000m acima de 500m) + modificador de calor pelo horário (13–17h: +0,4 · 17–20h: +0,2 · antes das 9h: −0,1) + modificador de terreno (grade média >5%: +0,6 · >3%: +0,3). RPE total × duração em minutos = sRPE.
5. Preencha também a entrada correspondente em "entries" com o campo cargaCorrida = sRPE calculado.

Formato exato de saída:
{
  "entries": {
    "YYYY-MM-DD": { "cargaCorrida": <sRPE> }
  },
  "treinos": [
    {
      "id": "<activity id do Strava>",
      "data": "YYYY-MM-DD",
      "hora": <hora local, inteiro 0-23>,
      "distKm": <número>,
      "duracaoMin": <número>,
      "elevM": <número>,
      "fcMedia": <número>,
      "fcMax": <número>,
      "paceSeg": <segundos por km>,
      "altitudeM": <número>,
      "gradeMedio": <número>,
      "cadencia": <passos/min total>,
      "re": <relative_effort do Strava>,
      "zonas": { "Z1":n, "Z2":n, "LT1":n, "CINZA":n, "LT2":n, "VO2":n }
    }
  ]
}

Se alguma atividade não tiver stream de FC, pule ela e me avise fora do JSON (numa linha separada, não dentro do bloco).`;

          return (
            <>
              <Card style={{ marginBottom:12, background:T.panel }}>
                <Eyebrow c={T.coral} icon={MessageSquareText}>Como funciona</Eyebrow>
                <div style={{ fontSize:12, color:T.t2, marginTop:6, lineHeight:1.6 }}>
                  Copie o prompt abaixo e cole numa mensagem pra mim no chat. Eu extraio os treinos do teu Strava,
                  calculo o sRPE e as zonas com a mesma fórmula do app, e devolvo um bloco JSON pronto.
                  Copie a resposta e cole no botão <b style={{color:T.t1}}>Importar</b> aqui em cima.
                </div>
              </Card>
              <Card>
                <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:8 }}>
                  <Eyebrow icon={Copy}>Prompt pronto pra copiar</Eyebrow>
                  <button onClick={async () => {
                      try { await navigator.clipboard.writeText(PROMPT); flash('Prompt copiado'); }
                      catch { flash('Selecione e copie manualmente o texto abaixo'); }
                    }}
                    style={{ background:`linear-gradient(135deg, ${T.coral}, #E6532F)`, border:'none', borderRadius:7,
                             padding:'6px 13px', fontSize:10.5, fontWeight:800, color:T.deep, cursor:'pointer',
                             display:'flex', alignItems:'center', gap:5 }}>
                    <Copy size={12}/>Copiar
                  </button>
                </div>
                <textarea readOnly value={PROMPT} rows={16}
                  style={{ width:'100%', background:T.panel, border:`1px solid ${T.brd2}`, borderRadius:8,
                           padding:'10px', color:T.t2, fontSize:10.5, fontFamily:T.mono, lineHeight:1.6,
                           resize:'vertical', outline:'none' }} />
              </Card>
            </>
          );
        })()}

        {/* ═══ PLANO (calendário do macrociclo) ═══ */}
        {aba==='plano' && (() => {
          const { a,m } = mesRef;
          const primeiro = new Date(a,m,1), offset = primeiro.getDay();
          const nDias = new Date(a,m+1,0).getDate();
          const cells = [...Array(offset).fill(null), ...Array.from({length:nDias},(_,i)=>i+1)];
          const nome = primeiro.toLocaleDateString('pt-BR',{month:'long',year:'numeric'});
          const mv = d => { const nm=m+d; setMesRef({ a:a+Math.floor(nm/12), m:((nm%12)+12)%12 }); };
          const sSel = sessaoDoDia(dataSel);
          const sSelForca = forcaDoDiaAdaptada(dataSel);
          return (
            <>
              <Card style={{ marginBottom:12 }}>
                <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:13 }}>
                  <button onClick={()=>mv(-1)} style={{ background:T.lift, border:`1px solid ${T.brd2}`, borderRadius:7, color:T.t2, width:30, height:30, cursor:'pointer', fontSize:15 }}>‹</button>
                  <div style={{ fontFamily:T.disp, fontSize:20, letterSpacing:.6, textTransform:'capitalize' }}>{nome}</div>
                  <button onClick={()=>mv(1)} style={{ background:T.lift, border:`1px solid ${T.brd2}`, borderRadius:7, color:T.t2, width:30, height:30, cursor:'pointer', fontSize:15 }}>›</button>
                </div>
                <div style={{ display:'grid', gridTemplateColumns:'repeat(7,1fr)', gap:3, marginBottom:5 }}>
                  {DIAS.map(d => <div key={d} style={{ textAlign:'center', fontSize:9, color:T.t3, fontFamily:T.mono }}>{d[0]}</div>)}
                </div>
                <div style={{ display:'grid', gridTemplateColumns:'repeat(7,1fr)', gap:3 }}>
                  {cells.map((d,i) => {
                    if (!d) return <div key={i}/>;
                    const iso = `${a}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
                    const reg = prontSerie.find(x=>x.data===iso);
                    const s = sessaoDoDia(iso);
                    const sf = sessaoForcaDoDia(new Date(iso+'T12:00:00').getDay());
                    const faseF = sf ? faseForca(iso) : null;
                    const opForca = faseF==='plena'?.85 : faseF==='reduzida'?.55 : faseF==='minima'?.3 : .12;
                    const isHoje = iso===hojeISO(), sel = iso===dataSel;
                    const pc = reg?.prontidao==null?null : reg.prontidao>=75?T.mint : reg.prontidao>=50?T.amber:T.red;
                    return (
                      <button key={i} onClick={()=>setDataSel(iso)} style={{
                        aspectRatio:'1', background: sel?T.lift:T.card,
                        border:`1px solid ${isHoje?T.coral : sel?T.brd2:T.brd}`, borderRadius:7,
                        cursor:'pointer', padding:2, display:'flex', flexDirection:'column',
                        alignItems:'center', justifyContent:'center', gap:1, position:'relative' }}>
                        {s && <div style={{ position:'absolute', top:2, left:2, right:2, height:2.5,
                                            borderRadius:2, background:s.lib.cor,
                                            opacity: s.tipo==='Chave'||s.tipo==='Teste'?1:.4 }}/>}
                        {sf && <div style={{ position:'absolute', top: s?5.5:2, left:2, right:2, height:2,
                                            borderRadius:2, background:sf.cor, opacity:opForca }}/>}
                        <span style={{ fontSize:11, fontFamily:T.mono, color:isHoje?T.coral:T.t2, fontWeight:isHoje?700:500, marginTop:3 }}>{d}</span>
                        {pc && <span style={{ width:4.5, height:4.5, borderRadius:'50%', background:pc }}/>}
                        {reg?.carga>0 && <span style={{ fontSize:7, fontFamily:T.mono, color:cargaCor(reg.carga) }}>{reg.carga}</span>}
                      </button>
                    );
                  })}
                </div>
                <div style={{ display:'flex', gap:11, marginTop:12, fontSize:9, color:T.t3, fontFamily:T.mono, flexWrap:'wrap' }}>
                  <span>Barra sup. = corrida</span>
                  <span>Barra inf. = força/calistenia (opacidade = fase: plena→zero)</span>
                  <span><span style={{color:T.mint}}>●</span> pront ≥75</span>
                  <span><span style={{color:T.amber}}>●</span> 50–74</span>
                  <span><span style={{color:T.red}}>●</span> &lt;50</span>
                </div>
              </Card>

              {sSelForca && (
                <ForcaCard sessao={sSelForca} dowLabel={`${DIAS[new Date(dataSel+'T12:00:00').getDay()]} ${dataSel.split('-').reverse().slice(0,2).join('/')}`}
                  aberta={openForca} onToggle={()=>setOpenForca(!openForca)} />
              )}

              {sSel && (
                <Card style={{ marginBottom:12, borderLeft:`3px solid ${sSel.lib.cor}` }}>
                  <Eyebrow c={sSel.lib.cor} icon={tipoIcone(sSel.tipo)}>
                    {DIAS[sSel.dow]} {dataSel.split('-').reverse().slice(0,2).join('/')} · {sSel.meso.emoji} {sSel.meso.k} S{sSel.nSem} · {sSel.semana.fase}
                  </Eyebrow>
                  <div style={{ fontFamily:T.disp, fontSize:23, letterSpacing:.5, margin:'6px 0 3px' }}>{sSel.titulo}</div>
                  <div style={{ fontSize:13, color:sSel.lib.cor, fontWeight:700, fontFamily:T.mono, marginBottom:10 }}>{sSel.detalhe}</div>
                  <div style={{ display:'flex', gap:7, flexWrap:'wrap' }}>
                    {[['FC',`${sSel.fc[0]}–${sSel.fc[1]}`],['Pace',sSel.pace],['Dur',`~${sSel.min}min`],['Vol sem',`${sSel.semana.vol}km`]].map(([l,v]) => (
                      <div key={l} style={{ background:T.lift, border:`1px solid ${T.brd}`, borderRadius:7, padding:'5px 10px' }}>
                        <div style={{ fontSize:8, color:T.t3, fontFamily:T.mono, textTransform:'uppercase' }}>{l}</div>
                        <div style={{ fontSize:12.5, fontWeight:700, fontFamily:T.mono }}>{v}</div>
                      </div>
                    ))}
                  </div>
                  <div style={{ fontSize:11, color:T.t2, marginTop:10, fontStyle:'italic', display:'flex', gap:6 }}>
                    <AlertTriangle size={12} color={T.amber} style={{ flexShrink:0, marginTop:2 }}/>{sSel.semana.alerta}
                  </div>
                </Card>
              )}

              <Card>
                <Eyebrow icon={CalendarDays}>Mesociclos</Eyebrow>
                <div style={{ marginTop:10, display:'flex', flexDirection:'column', gap:8 }}>
                  {MACRO.map(ms => {
                    const ativo = posHoje?.meso.k === ms.k;
                    return (
                      <div key={ms.k} style={{ background:ativo?T.lift:'transparent',
                        border:`1px solid ${ativo?ms.cor+'55':T.brd}`, borderRadius:10, padding:'10px 12px' }}>
                        <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center', gap:8, flexWrap:'wrap' }}>
                          <div style={{ fontSize:12.5, fontWeight:700, display:'flex', alignItems:'center', gap:7 }}>
                            {ms.emoji} {ms.k} · {ms.nome}
                            {ativo && <Pill cor={T.coral}>Atual</Pill>}
                          </div>
                          <div style={{ fontSize:10, color:T.t3, fontFamily:T.mono }}>{ms.sem.length} sem · {ms.meta}</div>
                        </div>
                        <div style={{ fontSize:10, color:T.t3, fontFamily:T.mono, marginTop:2 }}>{ms.periodo}</div>
                        {ativo && (
                          <>
                            <div style={{ fontSize:11.5, color:T.t2, marginTop:7, lineHeight:1.55 }}>{ms.foco}</div>
                            <div style={{ display:'flex', gap:2, marginTop:9 }}>
                              {ms.sem.map(w => (
                                <div key={w.s} title={`S${w.s} ${w.fase}`} style={{ flex:1, height:6, borderRadius:2,
                                  background: w.s < posHoje.nSem ? ms.cor
                                            : w.s === posHoje.nSem ? T.coral
                                            : w.fase==='Deload' ? T.brd2 : T.brd }}/>
                              ))}
                            </div>
                            <div style={{ fontSize:10, color:T.t3, marginTop:6, fontFamily:T.mono }}>
                              Musculação: {ms.musc}
                            </div>
                          </>
                        )}
                      </div>
                    );
                  })}
                </div>
              </Card>
            </>
          );
        })()}
      </main>

      {toast && (
        <div style={{ position:'fixed', bottom:20, left:'50%', transform:'translateX(-50%)',
                      background:T.lift, border:`1px solid ${T.coral}66`, borderRadius:11, padding:'11px 19px',
                      fontSize:12, fontWeight:600, boxShadow:'0 10px 32px rgba(0,0,0,.55)', zIndex:60, maxWidth:'92vw' }}>{toast}</div>
      )}

      <style>{FONTS + `
        *{box-sizing:border-box;margin:0;padding:0}
        button:focus-visible,input:focus-visible,label:focus-visible,textarea:focus-visible{outline:2px solid ${T.coral};outline-offset:2px}
        input[type=number]::-webkit-inner-spin-button{opacity:.25}
        ::selection{background:${T.coral}55;color:${T.t1}}
        ::-webkit-scrollbar{width:4px;height:4px}::-webkit-scrollbar-thumb{background:${T.brd2};border-radius:2px}
        nav::-webkit-scrollbar{display:none}
        .mslider{-webkit-appearance:none;appearance:none;width:100%;height:6px;border-radius:3px;outline:none;border:none;cursor:pointer}
        .mslider::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:22px;height:22px;border-radius:50%;background:#fff;border:4px solid var(--fill,#FF6B4A);box-shadow:0 2px 10px rgba(0,0,0,.5);cursor:grab}
        .mslider::-webkit-slider-thumb:active{cursor:grabbing;transform:scale(1.08)}
        .mslider::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:#fff;border:4px solid var(--fill,#FF6B4A);box-shadow:0 2px 10px rgba(0,0,0,.5);cursor:grab}
        .mslider::-moz-range-track{background:transparent}
        @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
      `}</style>
    </div>
  );
}

const _splash = document.getElementById('splash');
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
setTimeout(() => _splash && _splash.remove(), 350);
</script>
<script>
  if ('serviceWorker' in navigator && location.protocol === 'https:') {
    addEventListener('load', () => navigator.serviceWorker.register('./service-worker.js').catch(()=>{}));
  }
</script>
</body>
</html>
