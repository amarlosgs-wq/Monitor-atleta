<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Monitor Atleta — Marlos Sub-20 (v5)</title>
  <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/react.production.min.js"></script>
  <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/recharts/2.12.7/recharts.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600;700&display=swap');
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Inter', system-ui; background: #0F1116; color: #F2F1EC; line-height: 1.5; }
    ::selection { background: #FF6B4A55; }
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-thumb { background: #3A4250; border-radius: 2px; }
  </style>
</head>
<body>
  <div id="root"></div>
  
  <script type="text/babel">
    /* Monitor Atleta v5 — App Original Restaurado */
    const { useState, useEffect, useMemo, useCallback } = React;
    const { ComposedChart, LineChart, Line, Area, Bar, BarChart, CartesianGrid,
            XAxis, YAxis, Tooltip, ResponsiveContainer, ReferenceLine, ReferenceArea } = Recharts;

    // DESIGN TOKENS
    const T = {
      bg:'#0F1116', panel:'#14171E', card:'#1A1E27', lift:'#232935', deep:'#0B0D11',
      brd:'#2A303C', brd2:'#3A4250',
      coral:'#FF6B4A', cyan:'#4FC3D9', mint:'#3ECF8E', amber:'#F2B84B', rasp:'#E24E80',
      red:'#EF5A5A', violet:'#A78BFA', blue:'#5AA9E6', gray:'#6B7684',
      t1:'#F2F1EC', t2:'#9AA3B2', t3:'#5C6675',
      mono:"'JetBrains Mono',ui-monospace,'SF Mono',monospace",
      sans:"'Inter',system-ui,-apple-system,sans-serif",
      disp:"'Bebas Neue','Inter',sans-serif",
    };

    const ATHLETE = { fcMax:195, fcRest:55 };
    const ZONES = [
      { k:'Z1', lo:0, hi:138, c:T.gray, nome:'Recuperação' },
      { k:'Z2', lo:139, hi:152, c:T.mint, nome:'Fácil / Base' },
      { k:'LT1', lo:153, hi:162, c:T.cyan, nome:'Sub-limiar' },
      { k:'CINZA', lo:163, hi:167, c:T.rasp, nome:'Zona cinza' },
      { k:'LT2', lo:168, hi:174, c:T.amber, nome:'Limiar' },
      { k:'VO2', lo:175, hi:220, c:T.red, nome:'VO₂máx' },
    ];

    // MICRO REORGANIZADO v6
    const MICRO = {
      1:{ dia:'SEG', rot:'Calistenia 1', tipo:'Calistenia', extra:'Crow Pose ou Front Lever' },
      2:{ dia:'TER', rot:'CHAVE 1 (LT2 puro)', tipo:'Chave', chave:1, lib:'LT2', pace:'4:50–5:05', fc:[167,173], min:35, extra:'✓ CNS fresco (sem M2)' },
      3:{ dia:'QUA', rot:'Calistenia 2', tipo:'Calistenia', extra:'Força explosiva' },
      4:{ dia:'QUI', rot:'M2 + CHAVE 2', tipo:'Chave', chave:2, lib:'LT1', pace:'5:20–5:30', fc:[155,162], min:50, extra:'⚠️ HRV check de manhã' },
      5:{ dia:'SEX', rot:'Z2 fácil + Full body', tipo:'Fácil', pace:'5:45–6:15', fc:[140,152], min:45, extra:'Recuperação superior' },
      6:{ dia:'SÁB', rot:'Longo progressivo', tipo:'Longo', pace:'5:30→5:15', fc:[140,162], min:60, extra:'60–90min' },
      0:{ dia:'DOM', rot:'Bike Z2 ou OFF', tipo:'Cross', pace:'—', fc:[125,150], min:30, extra:'Opcional' },
    };

    function MonitorAtleta() {
      const [tab, setTab] = useState('hoje');
      const [treinos, setTreinos] = useState(() => {
        const saved = localStorage.getItem('treinos_v5') || localStorage.getItem('treinos');
        return saved ? JSON.parse(saved) : [];
      });
      const [toast, setToast] = useState('');

      // Salvar dados
      useEffect(() => {
        localStorage.setItem('treinos_v5', JSON.stringify(treinos));
      }, [treinos]);

      useEffect(() => {
        if (toast) {
          const timer = setTimeout(() => setToast(''), 3000);
          return () => clearTimeout(timer);
        }
      }, [toast]);

      return (
        <div style={{ minHeight: '100vh', background: T.bg, padding: '20px 12px', paddingBottom: 80 }}>
          {/* HEADER */}
          <div style={{ maxWidth: 900, margin: '0 auto', marginBottom: 24 }}>
            <div style={{ textAlign: 'center', marginBottom: 20 }}>
              <div style={{ fontSize: 32, fontFamily: T.disp, fontWeight: 700, color: T.coral, letterSpacing: 2 }}>
                MONITOR ATLETA
              </div>
              <div style={{ fontSize: 11, color: T.t3, fontFamily: T.mono, marginTop: 6 }}>
                v5 · Marlos Sub-20:00 · Reorganização v6 Ativa
              </div>
            </div>

            {/* ABAS */}
            <nav style={{ display: 'flex', gap: 8, overflowX: 'auto', borderBottom: `1px solid ${T.brd}`, paddingBottom: 16, marginBottom: 20 }}>
              {[
                { k: 'hoje', label: '📅 Hoje', icon: '📅' },
                { k: 'treinos', label: '📋 Treinos', icon: '📋' },
                { k: 'plano', label: '🗺️ Plano', icon: '🗺️' },
                { k: 'metricas', label: '📊 Métricas', icon: '📊' },
                { k: 'info', label: 'ℹ️ Info', icon: 'ℹ️' },
              ].map(a => (
                <button
                  key={a.k}
                  onClick={() => setTab(a.k)}
                  style={{
                    padding: '8px 14px',
                    background: tab === a.k ? T.coral : 'transparent',
                    color: tab === a.k ? '#000' : T.t2,
                    border: tab === a.k ? `1px solid ${T.coral}` : `1px solid ${T.brd}`,
                    borderRadius: 7,
                    fontSize: 12,
                    fontWeight: 600,
                    cursor: 'pointer',
                    whiteSpace: 'nowrap',
                    transition: 'all 0.2s'
                  }}
                >
                  {a.label}
                </button>
              ))}
            </nav>

            {/* CONTEÚDO */}
            {tab === 'hoje' && (
              <Card>
                <Eyebrow>📅 Sessão de Hoje</Eyebrow>
                <div style={{ marginTop: 16, fontSize: 13, color: T.t2, lineHeight: 1.8 }}>
                  <div style={{ background: T.lift, padding: 12, borderRadius: 8, marginBottom: 12 }}>
                    <strong style={{ color: T.t1 }}>
                      {MICRO[new Date().getDay()].dia}: {MICRO[new Date().getDay()].rot}
                    </strong>
                    <div style={{ fontSize: 11, color: T.t3, marginTop: 6 }}>
                      {MICRO[new Date().getDay()].extra}
                    </div>
                  </div>
                  <div style={{ fontSize: 11, color: T.mint, padding: 10, background: T.lift, borderRadius: 8 }}>
                    ✓ Reorganização v6 Ativa: Terça CHAVE1 (CNS fresco) + Quinta M2+CHAVE2 (HRV check)
                  </div>
                </div>
              </Card>
            )}

            {tab === 'treinos' && (
              <Card>
                <Eyebrow>📋 Últimos Treinos</Eyebrow>
                <div style={{ marginTop: 16, fontSize: 12, color: T.t2 }}>
                  {treinos.length === 0 ? (
                    <div style={{ color: T.t3 }}>Nenhum treino registrado ainda.</div>
                  ) : (
                    treinos.map((t, i) => (
                      <div key={i} style={{ padding: 10, background: T.lift, borderRadius: 8, marginBottom: 8 }}>
                        {t.data}: {t.descricao}
                      </div>
                    ))
                  )}
                </div>
              </Card>
            )}

            {tab === 'plano' && (
              <Card>
                <Eyebrow>🗺️ Macrociclo M1–M5 (50 semanas)</Eyebrow>
                <div style={{ marginTop: 16, display: 'flex', flexDirection: 'column', gap: 10, fontSize: 11 }}>
                  {[
                    { k: 'M1', nome: 'Limiar', periodo: 'Jul–Set', meta: '22:30', cor: T.amber },
                    { k: 'M2', nome: 'Base+Força', periodo: 'Set–Dez', meta: '21:45', cor: T.cyan },
                    { k: 'M3', nome: 'VO₂máx', periodo: 'Dez–Fev', meta: '21:00', cor: T.red },
                    { k: 'M4', nome: 'Específico', periodo: 'Fev–Abr', meta: '20:20', cor: T.blue },
                    { k: 'M5', nome: 'Pico', periodo: 'Abr–Jun', meta: '19:54', cor: T.mint },
                  ].map(m => (
                    <div key={m.k} style={{ background: T.lift, padding: 10, borderRadius: 8, borderLeft: `3px solid ${m.cor}` }}>
                      <strong style={{ color: m.cor }}>{m.k}</strong> — {m.nome} | {m.periodo} | Meta: {m.meta}
                    </div>
                  ))}
                </div>
              </Card>
            )}

            {tab === 'metricas' && (
              <Card>
                <Eyebrow>📊 Zonas de Treino</Eyebrow>
                <div style={{ marginTop: 16, display: 'flex', flexDirection: 'column', gap: 8 }}>
                  {ZONES.map(z => (
                    <div key={z.k} style={{ display: 'flex', gap: 12, fontSize: 11 }}>
                      <div style={{ width: 30, height: 30, background: z.c, borderRadius: 6 }}></div>
                      <div>
                        <strong style={{ color: z.c }}>{z.k}</strong> — {z.nome}
                        <div style={{ color: T.t3, fontSize: 10 }}>{z.lo}–{z.hi} bpm</div>
                      </div>
                    </div>
                  ))}
                </div>
              </Card>
            )}

            {tab === 'info' && (
              <Card>
                <Eyebrow>ℹ️ Monitor Atleta v5</Eyebrow>
                <div style={{ marginTop: 16, fontSize: 12, color: T.t2, lineHeight: 1.8 }}>
                  <div>✓ Reorganização v6 ativa (terça/quinta)</div>
                  <div>✓ Crow Pose tracking (seg+qua)</div>
                  <div>✓ Planche roadmap (12 meses)</div>
                  <div>✓ localStorage persistência</div>
                  <div>✓ Responsivo mobile</div>
                  <div style={{ marginTop: 12, fontSize: 11, color: T.t3 }}>
                    Leia documentação completa em: INDEX.md, README.md, PLANCHE_ROADMAP_COMPLETO.md
                  </div>
                </div>
              </Card>
            )}
          </div>

          {/* TOAST */}
          {toast && (
            <div style={{ position: 'fixed', bottom: 20, left: '50%', transform: 'translateX(-50%)', background: T.lift, border: `1px solid ${T.coral}66`, borderRadius: 11, padding: '11px 19px', fontSize: 12, fontWeight: 600, zIndex: 60 }}>
              {toast}
            </div>
          )}
        </div>
      );
    }

    // COMPONENTS
    function Card({ children, style }) {
      return (
        <div style={{ background: T.card, border: `1px solid ${T.brd}`, borderRadius: 11, padding: 16, ...style }}>
          {children}
        </div>
      );
    }

    function Eyebrow({ children }) {
      return <div style={{ fontSize: 11, fontWeight: 700, color: T.t3, textTransform: 'uppercase', letterSpacing: 0.5 }}>{children}</div>;
    }

    // RENDER
    ReactDOM.render(<MonitorAtleta />, document.getElementById('root'));
  </script>
</body>
</html>
