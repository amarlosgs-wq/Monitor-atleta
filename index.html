<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Monitor Atleta</title>
<meta name="description" content="Macrociclo 2026-2027 — Monitor de recuperação, carga e periodização" />

<!-- PWA -->
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#070C18" />
<link rel="icon" href="icons/icon-192.png" />
<link rel="apple-touch-icon" href="icons/icon-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Monitor Atleta" />

<style>
  html, body { margin:0; padding:0; background:#070C18; overscroll-behavior-y: none; }
  #root { min-height:100vh; }
  #boot {
    position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
    background:#070C18; color:#8B9CB8; font-family:system-ui, sans-serif; font-size:13px;
    letter-spacing:.5px; z-index:9999;
  }
</style>

<script>
  // ── Polyfill de window.storage ──────────────────────────────────────────
  // O app foi escrito originalmente pra rodar dentro do sandbox de Artifacts
  // do claude.ai, que injeta um objeto global `window.storage` (get/set/
  // delete/list assíncronos). Fora desse sandbox — ou seja, aqui, hospedado
  // no GitHub Pages — esse objeto NÃO existe nativamente no navegador.
  // Sem isso, toda chamada window.storage.get/set falhava silenciosamente
  // (o try/catch do app engolia o erro) e nada era salvo. Este polyfill
  // reimplementa a mesma assinatura usando localStorage de verdade, então
  // o resto do código (app.jsx) funciona sem precisar de nenhuma alteração.
  if (!window.storage) {
    const PREFIX = 'monitor_atleta::';
    window.storage = {
      async get(key) {
        try {
          const raw = localStorage.getItem(PREFIX + key);
          return raw != null ? { key, value: raw } : null;
        } catch (e) { console.error('storage.get falhou', e); return null; }
      },
      async set(key, value) {
        try {
          localStorage.setItem(PREFIX + key, value);
          return { key, value };
        } catch (e) { console.error('storage.set falhou', e); return null; }
      },
      async delete(key) {
        try {
          localStorage.removeItem(PREFIX + key);
          return { key, deleted: true };
        } catch (e) { return null; }
      },
      async list(prefix) {
        try {
          const keys = Object.keys(localStorage)
            .filter(k => k.startsWith(PREFIX + (prefix || '')))
            .map(k => k.slice(PREFIX.length));
          return { keys };
        } catch (e) { return { keys: [] }; }
      },
    };
  }
</script>

<!-- Import map: fixa as versões e garante uma única instância de React em todo o app -->
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@18.3.1",
    "react/jsx-runtime": "https://esm.sh/react@18.3.1/jsx-runtime",
    "react-dom": "https://esm.sh/react-dom@18.3.1",
    "react-dom/client": "https://esm.sh/react-dom@18.3.1/client",
    "recharts": "https://esm.sh/recharts@2.12.7?external=react,react-dom"
  }
}
</script>
</head>
<body>
  <div id="boot">Carregando Monitor Atleta…</div>
  <div id="root"></div>

  <!-- Babel Standalone: transpila só JSX (preset-react), preserva import/export nativos -->
  <script src="https://unpkg.com/@babel/standalone@7.25.6/babel.min.js"></script>
  <script type="text/babel" data-presets="react" data-type="module" src="app.jsx"></script>

  <script>
    // remove a tela de carregamento assim que o React montar (root ganha filhos)
    const obs = new MutationObserver(() => {
      const root = document.getElementById('root');
      if (root && root.children.length) {
        document.getElementById('boot')?.remove();
        obs.disconnect();
      }
    });
    obs.observe(document.getElementById('root'), { childList: true });

    // registra o service worker (necessário pro Chrome oferecer instalação como app)
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('service-worker.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
